name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MyApp/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Expo Doctor
        # Versión fijada: expo-doctor 1.21.7 (2026-11-11) se publicó sin la dependencia @expo/env y falla al arrancar.
        run: npx --yes expo-doctor@1.21.6
      - name: Tests
        run: npx jest --watchAll=false
